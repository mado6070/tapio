<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة تصميم كرت الوزير ستور الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #070807;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.4rem;
        }

        .cards-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        /* تصميم الكرت (بمقياس بطاقة الائتمان الحقيقية) */
        .nfc-card {
            width: 340px;
            height: 210px;
            background: linear-gradient(135deg, #161614 0%, #0a0a09 100%);
            border: 2px solid #d4af37;
            border-radius: 16px;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.1);
        }

        .card-label {
            font-size: 0.8rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* الوجه الأمامي */
        .card-front {
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .card-logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            margin-bottom: 10px;
            background: #fff;
        }

        .card-title {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .card-slogan {
            font-size: 0.75rem;
            color: #d4af37;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .nfc-icon {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #d4af37;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* الوجه الخلفي */
        .card-back {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .qr-box {
            width: 90px;
            height: 90px;
            background: #fff;
            padding: 5px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #d4af37;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .back-info {
            text-align: right;
            flex: 1;
            padding-right: 15px;
        }

        .back-info h4 {
            color: #d4af37;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .back-info p {
            font-size: 0.75rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .card-footer {
            position: absolute;
            bottom: 10px;
            right: 20px;
            font-size: 0.65rem;
            color: #888;
        }
        .card-footer span {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>تصميم كرت "الوزير ستور" الذكي (NFC & QR)</h2>

    <div class="cards-wrapper">
        <!-- الوجه الأمامي للكرت -->
        <div>
            <div class="card-label">الوجه الأمامي (واجهة الفخامة)</div>
            <div class="nfc-card card-front">
                <div>
                    <img src="logo.JPG" alt="Logo" class="card-logo" onerror="this.src='https://via.placeholder.com/55?text=Logo'">
                    <div class="card-title">الوزير ستور</div>
                    <div class="card-slogan">ثقة - أمان - توفير</div>
                </div>
                <div class="nfc-icon"><i class="fa-solid fa-wifi" style="transform: rotate(90deg);"></i></div>
                <div class="card-footer">Powered by <span>tapio</span></div>
            </div>
        </div>

        <!-- الوجه الخلفي للكرت -->
        <div>
            <div class="card-label">الوجه الخلفي (QR والدفع السريع)</div>
            <div class="nfc-card card-back">
                <div class="back-info">
                    <h4>امسح الكود</h4>
                    <p>افتح موقعنا، تواصل معنا، وادفع بكل سهولة عبر الكرت الذكي.</p>
                </div>
                <div class="qr-box">
                    <!-- نموذج شكل QR Code -->
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://mudd-tech.github.io" alt="QR Code">
                </div>
                <div class="card-footer">Powered by <span>tapio</span></div>
            </div>
        </div>
    </div>

</body>
</html>
