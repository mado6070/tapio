<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الكرت الذكي - الوزير ستور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #141412 0%, #050504 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-label {
            font-size: 0.9rem;
            color: #fef08a;
            margin-bottom: 12px;
            font-weight: 600;
            background: rgba(212, 175, 55, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* تصميم الكرت الذكي الفاخر بمقاسات البطاقة الحقيقية */
        .smart-card {
            width: 360px;
            height: 220px;
            background: linear-gradient(135deg, rgba(30, 30, 28, 0.95) 0%, rgba(10, 10, 9, 0.95) 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 18px;
            position: relative;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(212,175,55,0.08);
            overflow: hidden;
        }

        /* تأثير إضاءة جمالية ذهبية خافتة داخل الكرت */
        .smart-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        /* --- الوجه الأمامي --- */
        .card-front {
            align-items: center;
            text-align: center;
            justify-content: center;
        }

        .logo-box {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            z-index: 2;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .brand-name {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            z-index: 2;
        }

        .brand-slogan {
            font-size: 0.8rem;
            color: #d4af37;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 2;
        }

        .nfc-wave {
            position: absolute;
            bottom: 18px;
            left: 20px;
            color: #d4af37;
            font-size: 1.2rem;
            opacity: 0.85;
            z-index: 2;
        }

        /* --- الوجه الخلفي --- */
        .card-back {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
        }

        .back-text {
            flex: 1;
            padding-left: 15px;
        }

        .back-text h3 {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .back-text p {
            font-size: 0.78rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .qr-frame {
            width: 95px;
            height: 95px;
            background: #fff;
            padding: 6px;
            border-radius: 12px;
            border: 2px solid #d4af37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-footer {
            position: absolute;
            bottom: 12px;
            right: 22px;
            font-size: 0.7rem;
            color: #888;
            z-index: 2;
        }
        .card-footer span {
            color: #d4af37;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>✨ التصميم الفاخر لبطاقات "الوزير ستور" الذكية ✨</h2>

    <div class="cards-container">
        <!-- الوجه الأمامي -->
        <div class="card-wrapper">
            <div class="card-label">الوجه الأمامي (الهوية والبصمة)</div>
            <div class="smart-card card-front">
                <div class="logo-box">
                    <img src="logo.JPG" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/65?text=Logo'">
                </div>
                <div>
                    <div class="brand-name">الوزير ستور</div>
                    <div class="brand-slogan">ثقة - أمان - توفير</div>
                </div>
                <div class="nfc-wave"><i class="fa-solid fa-wifi" style="transform: rotate(90deg);"></i></div>
                <div class="card-footer">Powered by <span>tapio</span></div>
            </div>
        </div>

        <!-- الوجه الخلفي -->
        <div class="card-wrapper">
            <div class="card-label">الوجه الخلفي (التواصل والدفع الفوري)</div>
            <div class="smart-card card-back">
                <div class="back-text">
                    <h3>امسح الكود</h3>
                    <p>تواصل معنا، تصفح موقعنا، وادفع بكل سهولة بلمسة واحدة.</p>
                </div>
                <div class="qr-frame">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://mado6070.github.io/tapio/" alt="QR Code">
                </div>
                <div class="card-footer">Powered by <span>tapio</span></div>
            </div>
        </div>
    </div>

</body>
</html>
